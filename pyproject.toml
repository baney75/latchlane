[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "latchlane"
version = "0.1.0"
description = "Your keys. Your agents. Your call. A private credential broker and agent skill."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=46,<51", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "platformdirs>=4,<5", "filelock>=3.18,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
latchlane = "latchlane.cli:main"

[project.urls]
Repository = "https://github.com/baney75/latchlane"

[tool.hatch.build.targets.wheel]
packages = ["src/latchlane"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"skills/latchlane/SKILL.md" = "latchlane/SKILL.md"
